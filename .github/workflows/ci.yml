name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        name: KaTeX ${{ matrix.katex }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The ends of the supported range (package.json peerDependencies).
                katex: ["0.18.9", "0.19.0"]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm install --no-save katex@${{ matrix.katex }}
            # KaTeX's screenshot cases of exactly that version.
            - run: npm run corpus
            - run: npm test
            - run: npm run test:types
            - run: npx prettier --check .
            - run: npx playwright install --with-deps chromium
            - run: npm run test:browser
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: report-katex-${{ matrix.katex }}
                  path: report/

    engines:
        name: Firefox and WebKit on Linux (informational)
        runs-on: ubuntu-latest
        continue-on-error: true
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps firefox webkit
            - run: npm run test:engines
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: report-engines
                  path: report/

    safari:
        # Playwright's WebKit on macOS: the engine and the font rendering of
        # Safari, the closest to it that can be automated.
        name: WebKit on macOS (Safari)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npx playwright install webkit
            # WebKit's HTML is no pixel reference, see corpus.spec.mjs.
            - run: npm run test:engines -- --project webkit
              env:
                  KATEX_CANVAS_SMOKE: 1
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: report-safari
                  path: report/
